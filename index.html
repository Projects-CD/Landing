<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feydom – Poletna razprodaja modularnih sedežnih garnitur</title>
  <meta name="description" content="Poletna akcija Feydom: –20 % na vse modularne sedežne garniture. Brezplačna dostava. Akcija traja do 31. 7. 2026." />

  <!-- Favicon (Feydom) -->
  <link rel="icon" type="image/x-icon" href="https://s3.amazonaws.com/webflow-prod-assets/6a133e5f7f5d942da2a4c175/6a133f09f06e217df642878a_favicon-feydom.ico" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ===================== RESET ===================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    img, svg, video { display: block; max-width: 100%; }
    a { text-decoration: none; color: inherit; }
    ul { list-style: none; }
    button { font: inherit; cursor: pointer; border: none; background: none; }

    /* ===================== BRAND TOKENS ===================== */
    :root {
      --red: #A21318;          /* Feydom brand red */
      --red-dark: #810f13;
      --red-light: #c5181e;
      --ink: #1a1a1a;          /* primary text */
      --muted: #6b6b6b;        /* secondary text */
      --line: #e6e6e6;         /* borders */
      --bg: #ffffff;
      --bg-soft: #f7f5f2;      /* warm off-white */
      --white: #ffffff;
      --gold: #c9a14a;

      --maxw: 1200px;
      --radius: 14px;
      --shadow: 0 8px 30px rgba(0,0,0,.08);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .container {
      width: 100%;
      max-width: var(--maxw);
      margin-inline: auto;
      padding-inline: 20px;
    }

    /* ===================== 1. TOPBAR ===================== */
    .topbar {
      background: var(--red);
      color: var(--white);
      font-size: .875rem;
      font-weight: 500;
      letter-spacing: .01em;
    }
    .topbar__inner {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px 24px;
      flex-wrap: wrap;
      padding: 8px 20px;
      text-align: center;
    }
    .topbar__msg {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .topbar__msg strong { font-weight: 700; }
    .topbar__sep {
      opacity: .45;
      font-weight: 400;
    }
    .topbar__highlight {
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-thickness: 2px;
    }

    /* Countdown */
    .countdown {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .countdown__label {
      opacity: .85;
      font-weight: 500;
    }
    .countdown__timer {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .countdown__unit {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      line-height: 1;
      background: rgba(255,255,255,.14);
      border-radius: 6px;
      padding: 4px 6px;
      min-width: 38px;
    }
    .countdown__num {
      font-size: .95rem;
      font-weight: 700;
    }
    .countdown__cap {
      font-size: .55rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity: .8;
      margin-top: 2px;
    }
    .countdown__colon {
      font-weight: 700;
      opacity: .5;
      margin-top: -10px;
    }

    @media (max-width: 600px) {
      .topbar__inner { flex-direction: column; gap: 8px; padding: 10px 16px; }
      .topbar__sep { display: none; }
      .countdown__unit { min-width: 34px; padding: 3px 5px; }
    }
  </style>
</head>
<body>

  <!-- ===================== 1. TOPBAR ===================== -->
  <div class="topbar" id="topbar">
    <div class="topbar__inner">
      <span class="topbar__msg">
        <span aria-hidden="true">☀️</span>
        <span><strong>Poletna razprodaja –20 %</strong> na vse modularne garniture</span>
      </span>
      <span class="topbar__sep" aria-hidden="true">·</span>
      <span class="topbar__highlight">Brezplačna dostava</span>
      <span class="topbar__sep" aria-hidden="true">·</span>
      <span class="countdown" aria-label="Čas do konca akcije">
        <span class="countdown__label">Akcija se zaključi čez:</span>
        <span class="countdown__timer" id="countdown" role="timer" aria-live="off">
          <span class="countdown__unit"><span class="countdown__num" data-days>00</span><span class="countdown__cap">dni</span></span>
          <span class="countdown__colon">:</span>
          <span class="countdown__unit"><span class="countdown__num" data-hours>00</span><span class="countdown__cap">ur</span></span>
          <span class="countdown__colon">:</span>
          <span class="countdown__unit"><span class="countdown__num" data-mins>00</span><span class="countdown__cap">min</span></span>
          <span class="countdown__colon">:</span>
          <span class="countdown__unit"><span class="countdown__num" data-secs>00</span><span class="countdown__cap">sek</span></span>
        </span>
      </span>
    </div>
  </div>

  <!-- ===================== 2. NAVBAR (kmalu) ===================== -->
  <!-- ===================== 3. HERO (kmalu) ===================== -->
  <!-- ===================== 4. BENEFIT + AWARD SLIDER (kmalu) ===================== -->
  <!-- ===================== 5. CATEGORY (kmalu) ===================== -->
  <!-- ===================== 6. TESTIMONIALS (kmalu) ===================== -->
  <!-- ===================== 7. FAQ (kmalu) ===================== -->
  <!-- ===================== 8. BOTTOM CTA (kmalu) ===================== -->
  <!-- ===================== 9. FOOTER (kmalu) ===================== -->

  <script>
    /* ===================== TOPBAR COUNTDOWN ===================== */
    (function () {
      var target = new Date('2026-07-31T23:59:59').getTime();
      var el = document.getElementById('countdown');
      if (!el) return;
      var $d = el.querySelector('[data-days]');
      var $h = el.querySelector('[data-hours]');
      var $m = el.querySelector('[data-mins]');
      var $s = el.querySelector('[data-secs]');
      var pad = function (n) { return String(n).padStart(2, '0'); };

      function tick() {
        var diff = target - Date.now();
        if (diff <= 0) {
          $d.textContent = $h.textContent = $m.textContent = $s.textContent = '00';
          clearInterval(timer);
          return;
        }
        var s = Math.floor(diff / 1000);
        $d.textContent = pad(Math.floor(s / 86400));
        $h.textContent = pad(Math.floor((s % 86400) / 3600));
        $m.textContent = pad(Math.floor((s % 3600) / 60));
        $s.textContent = pad(s % 60);
      }
      tick();
      var timer = setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
